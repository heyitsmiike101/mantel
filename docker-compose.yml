services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    image: mantel:${APP_VERSION:-dev}
    container_name: mantel
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - mantel-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      BUILD_TIME: ${BUILD_TIME:-}

volumes:
  mantel-data:
