name: Release

# Tests run on every push and every pull request -- a tag-only trigger meant a
# contributor's PR could be merged without CI ever having looked at it. The
# image job below is still gated on a v* tag, so ordinary pushes only test.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check app tests
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

  image:
    needs: test
    # Publishing is part of merging, not a separate thing to remember. A push to main
    # whose VERSION has not been released yet publishes it and tags the commit; a push
    # whose VERSION is already tagged does nothing, so ordinary commits are free. A v*
    # tag pushed by hand still works, for re-releasing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # write, because this job creates the release tag it publishes under.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this VERSION is a release
        id: gate
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.5.8 also publishes as 0.5, so an install can follow a minor line.
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Already released: v$version. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version: v$version. Publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release
        if: steps.gate.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.gate.outputs.version }}" \
            -m "Release v${{ steps.gate.outputs.version }}"
          # Pushed with GITHUB_TOKEN, which deliberately does not start another run --
          # so this cannot loop back into itself.
          git push origin "v${{ steps.gate.outputs.version }}"

      # QEMU provides the arm64 leg; the frontend stage pins itself to
      # BUILDPLATFORM so only the Python layer is emulated.
      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.publish == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          images: ghcr.io/${{ github.repository }}
          # Driven by the VERSION file rather than the ref, so a main push and a
          # hand-pushed tag produce identical tags.
          tags: |
            type=raw,value=${{ steps.gate.outputs.version }}
            type=raw,value=${{ steps.gate.outputs.series }}
            type=raw,value=latest

      - name: Read VERSION
        id: version
        run: |
          echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          # github.event.repository.pushed_at is a bare epoch on a tag push, and
          # /api/version documents build_time as ISO-8601. Stamp it ourselves.
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_TIME=${{ steps.version.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
